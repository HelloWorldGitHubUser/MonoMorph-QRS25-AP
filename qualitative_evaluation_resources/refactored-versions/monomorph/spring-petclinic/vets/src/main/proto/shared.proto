syntax = "proto3";

package org.springframework.samples.petclinic.monomorph.id.shared;

option java_multiple_files = true;
option java_package = "org.springframework.samples.petclinic.monomorph.id.shared";

message RefactoredObjectID {
    string instanceID = 1;
    string classID = 2;
    string serviceID = 3;
}