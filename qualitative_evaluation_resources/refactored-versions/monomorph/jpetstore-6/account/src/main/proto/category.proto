syntax = "proto3";

package org.mybatis.jpetstore.monomorph.dto.generated.proto.category;

option java_multiple_files = true;
option java_package = "org.mybatis.jpetstore.monomorph.dto.generated.proto.category";

message CategoryDTO {
    int64 serialVersionUID = 1;
    string categoryId = 2;
    string name = 3;
    string description = 4;
}

